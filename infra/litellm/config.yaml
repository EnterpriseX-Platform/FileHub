# LiteLLM gateway config for FileHub's AI-native layer.
#
# FileHub talks OpenAI-compatible to LiteLLM (AI_BASE_URL=http://localhost:4000/v1);
# LiteLLM routes the two logical models to backends. Default = local Ollama
# (self-hosted, no egress). To use a cloud model, add an entry here (e.g.
# model: openai/text-embedding-3-small or anthropic/claude-...) and point the
# alias at it — FileHub is unchanged.
#
# IMPORTANT: the "embed" model MUST be 768-dim to match migrations/0016
# (vector(768)). nomic-embed-text is 768.
model_list:
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
  - model_name: chat
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true        # tolerate provider-specific params across backends

general_settings:
  master_key: sk-filehub-dev   # FileHub sends this as AI_API_KEY (dev only — rotate per env)
