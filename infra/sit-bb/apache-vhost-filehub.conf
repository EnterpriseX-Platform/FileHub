# ----------------------------------------------------------------------
# filehub — Rust API + Next.js frontend (separate deployments)
# ----------------------------------------------------------------------
# Splice this block into SYSTEM_ADMIN/apache-config/neb-dev.conf alongside
# the bgaXX entries (alphabetical order), and add 30814 to the port notes.
#
# ONE entry only: the app ships under basePath /filehub and the Next.js
# server proxies /filehub/api/* to the Rust API inside the cluster, so the
# browser never needs a direct path to the API. Bare-path bounces
# (/files → /filehub/files) are handled by Next's own redirects.
ProxyPass        /filehub/ http://10.x.x.x:30814/filehub/
ProxyPassReverse /filehub/ http://10.x.x.x:30814/filehub/
