# FileHub Postgres — same shape as deployment-bbdoc-postgres.yaml.
# NFS PV on the shared datastore host; create the export dir first:
#   ssh 10.1.102.92 'mkdir -p /datastore/filehub/postgres'
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filehub-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.1.102.92
    path: /datastore/filehub/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filehub-postgres-pvc
  namespace: neb-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: filehub-postgres-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filehub-postgres
  namespace: neb-dev
  labels:
    app: filehub-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume — never two postgres pods on one PGDATA
  selector:
    matchLabels:
      app: filehub-postgres
  template:
    metadata:
      labels:
        app: filehub-postgres
    spec:
      containers:
        - name: filehub-postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "filehub"
            - name: POSTGRES_USER
              value: "filehub"
            - name: POSTGRES_PASSWORD
              value: "REPLACE_ME_DB_PASSWORD"   # must match DATABASE_URL in secret-filehub-api.yaml
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: TZ
              value: "Asia/Bangkok"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: filehub-postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "filehub", "-d", "filehub"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "512Mi", cpu: "200m" }
      volumes:
        - name: filehub-postgres-storage
          persistentVolumeClaim:
            claimName: filehub-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: filehub-postgres-svc
  namespace: neb-dev
spec:
  selector:
    app: filehub-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
