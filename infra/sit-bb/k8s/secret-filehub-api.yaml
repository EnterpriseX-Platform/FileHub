# FileHub backend secret — fill every REPLACE_ME_* before applying.
# Release builds fail-fast if DATABASE_URL / CORS_ORIGIN / WOPI_SECRET are
# missing, so a half-filled secret shows up as CrashLoopBackOff with a clear
# panic message in `kubectl logs`.
apiVersion: v1
kind: Secret
metadata:
  name: filehubapi-secret
  namespace: neb-dev
type: Opaque
stringData:
  # Password must match POSTGRES_PASSWORD in deployment-filehub-postgres.yaml.
  DATABASE_URL: "postgresql://filehub:REPLACE_ME_DB_PASSWORD@filehub-postgres-svc:5432/filehub"
  # Public origin users hit through Apache — exact scheme+host, never "*"
  # (cookies require credentialed CORS).
  CORS_ORIGIN: "http://REPLACE_ME_PUBLIC_HOST"
  # Generate fresh per environment:  openssl rand -hex 32
  WOPI_SECRET: "REPLACE_ME_HEX64"
  # Optional but recommended — AES-256-GCM at-rest encryption of blobs.
  # Generate:  openssl rand -hex 32   (back this up; losing it = losing files)
  STORAGE_ENC_KEY: "REPLACE_ME_HEX64"
  # SIT is plain http behind Apache (SSL redirect still commented out in
  # neb-dev.conf) — a Secure cookie would never be sent. Flip to "true" when
  # the vhost gets TLS.
  COOKIE_SECURE: "false"
  STORAGE_ROOT: "/data/storage"
  ROTATION_INTERVAL_SECS: "3600"
  RUST_LOG: "info"
