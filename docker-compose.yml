services:
  postgres:
    image: postgres:16-alpine
    container_name: filehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: filehub
      POSTGRES_PASSWORD: filehub
      POSTGRES_DB: filehub
    ports:
      - "5434:5432"
    volumes:
      - filehub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filehub -d filehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Collabora Online (Code build) — opensource LibreOffice Online.  File Hub
  # acts as a WOPI host (`backend/src/wopi.rs`) and Collabora is the editor
  # iframe the browser loads.  This service is OPTIONAL: with
  # `workspace_config.office_viewer = 'pdf'` (the default), File Hub falls
  # back to the PDF-converted preview and Collabora doesn't need to be up.
  #
  # Dev defaults disable SSL + cookie security so a plain http://localhost
  # browser can talk to ws://localhost:9980 without certificate gymnastics.
  # For production set `DONT_GEN_SSL_CERT=` (empty) and front Collabora with
  # a TLS-terminating proxy that issues wss:// to the browser.
  collabora:
    # Custom build that patches bundle.js to nuke the Help-tab menu items
    # at the source — see infra/collabora/Dockerfile for the sed script.
    # No more CSS whack-a-mole + no browser-cache headaches because the
    # items are never rendered to the DOM in the first place.
    build:
      context: ./infra/collabora
      dockerfile: Dockerfile
    image: filehub-collabora:branded
    container_name: filehub-collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      # CSV of regex host patterns that Collabora will accept as WOPI hosts.
      # We use `host.docker.internal` because the Rust backend runs on the
      # host, not inside the compose network.
      aliasgroup1: "http://host.docker.internal:8090,http://host.docker.internal:3001"
      # Aggressive UI cleanup:
      #   - welcome.enable=false             → no first-load "Explore the New" page
      #   - feedback.show=false              → no "Send feedback" prompts
      #   - browsersetting.enable=false      → no Collabora telemetry settings
      #   - user_interface.use_integration_theme=true → take colors from parent CSS
      #   - net.frame_ancestors              → allow our iframe to embed it
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:welcome.enable=false
        --o:feedback.show=false
        --o:browsersetting.enable=false
        --o:user_interface.use_integration_theme=true
        --o:net.frame_ancestors=http://localhost:3001
      DONT_GEN_SSL_CERT: "true"
      username: "admin"
      password: "admin"
    volumes:
      # File Hub branding overrides.  Collabora's `cool.html` template
      # references `%BRANDING_CSS%`, which resolves to
      # `/usr/share/coolwsd/browser/dist/branding.css` — the file we
      # override here.  Mounting read-only because the contents live in
      # git under `infra/collabora/` and shouldn't be mutated at runtime.
      - ./infra/collabora/branding.css:/usr/share/coolwsd/browser/dist/branding.css:ro
    extra_hosts:
      # Linux/Docker desktop compatibility — macOS already resolves
      # `host.docker.internal` natively but Linux containers don't.
      - "host.docker.internal:host-gateway"
    cap_add:
      - MKNOD

  # MinIO — S3-compatible object storage.  OPTIONAL: only needed when the
  # backend runs with STORAGE_BACKEND=s3.  The backend's hand-rolled SigV4
  # client (backend/src/store/s3.rs) talks to the S3 API on :9000; the web
  # console is on :9001 (log in with the root creds below).
  #
  # MinIO REQUIRES path-style addressing — keep S3_PATH_STYLE=true (the
  # backend default).  These dev creds are throwaway: rotate MINIO_ROOT_*
  # and the matching S3_ACCESS_KEY/S3_SECRET_KEY for any real environment.
  minio:
    image: minio/minio:latest
    container_name: filehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: filehub
      MINIO_ROOT_PASSWORD: filehub-minio-dev
    ports:
      - "9000:9000"   # S3 API — point S3_ENDPOINT here
      - "9001:9001"   # web console (browser)
    volumes:
      - filehub-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot init: wait for MinIO, then create the bucket the backend expects
  # (S3_BUCKET=filehub-storage).  Exits 0 once the bucket exists; safe to
  # re-run (`--ignore-existing`).
  minio-setup:
    image: minio/mc:latest
    container_name: filehub-minio-setup
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set fh http://minio:9000 filehub filehub-minio-dev 2>/dev/null; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing fh/filehub-storage &&
      echo 'bucket filehub-storage ready'
      "

volumes:
  filehub-pgdata:
  filehub-minio-data:
