  <rect x="20" y="30" width="18" height="7" rx="3.5" fill="#fdfdfb" opacity=".9"/>
  <!-- AI sparkle — the one violet accent -->
  <path d="M49 14 l1.8 4.2 4.2 1.8 -4.2 1.8 -1.8 4.2 -1.8 -4.2 -4.2 -1.8 4.2 -1.8 z" fill="#a78bfa"/>
