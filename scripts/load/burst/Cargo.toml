[package]
name = "burst"
version = "0.1.0"
edition = "2021"
description = "N people press Upload within RAMP seconds; one file each. Prints status counts and latency."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json"] }
serde_json = "1"
