openapi: 3.1.0

info:
  title: File Hub API
  version: "1.0.0"
  description: |
    HTTP API for **File Hub** (Rust + Axum backend).

    ## Base path
    The backend mounts every route under **`/fh`** (see `lib.rs::build_router`).
    The Next.js frontend is served under basePath **`/filehub`** and rewrites
    `/filehub/api/*` → `<backend>/fh/api/*`. So the same logical path `/api/files`
    is reached as:
      - `http://<backend>:8090/fh/api/files`  (direct to the Rust service)
      - `http://<frontend>:3001/filehub/api/files`  (via the app, same-origin cookie)

    Pick the matching `servers` entry below; all `paths` are written relative to it.

    ## Authentication
    Two schemes, either satisfies any private endpoint:

    - **Session cookie** (`cookieAuth`) — for browsers. `POST /api/auth/login`
      sets an **HttpOnly** cookie `filehub_session` (32-byte random token,
      14-day TTL, stored in the `sessions` table). Send it on every request
      (`credentials: "include"` in fetch, `-b cookies.txt` in curl).
    - **API key / Bearer** (`bearerAuth`) — for headless apps / integrations.
      An admin mints a key via `POST /api/api-keys` bound to a service-account
      user; send it as `Authorization: Bearer fhk_…`. The key authenticates AS
      that user, inheriting its role + system access. Revoke via
      `DELETE /api/api-keys/{id}`. See INTEGRATION.md.

    ## Authorization (roles)
    Three roles: `admin`, `editor`, `viewer`.
      - **viewer** — read-only (browse, download, comment).
      - **editor** — + upload / edit / delete (soft) / restore / share / create folders & views.
      - **admin**  — + hard-delete (purge), buckets, members, rotation, quotas, workspace settings.
    Mutating endpoints return **403** for insufficient role; reads on resources the
    caller can't see return **404** (existence is not leaked).

    ## Uploads
      - **Small/normal files** → `POST /api/files` (multipart, body limit 64 MiB).
      - **Large/resumable files** → TUS 1.0.0 at `/api/uploads` (the web client switches
        at ~50 MiB). See the `Upload` tag.

servers:
  - url: http://localhost:8090/fh
    description: Direct to the Rust backend (dev)
  - url: http://localhost:3001/filehub
    description: Via the Next.js app proxy (same-origin cookie)

tags:
  - name: Auth
  - name: Files
  - name: Upload
  - name: Search
  - name: Folders
  - name: Sharing
  - name: Comments
  - name: Workflow
  - name: Notifications
  - name: Trash
  - name: Views
  - name: Systems & Orgs
  - name: Admin
  - name: Reports
  - name: AI
  - name: Checkout
  - name: Signatures
  - name: Requests
  - name: Health

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ─────────────────────────── Auth ───────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in; sets the filehub_session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: "Logged in. Sets the filehub_session cookie (HttpOnly, SameSite=Lax, Max-Age=1209600 / 14 days)."
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Too many failed attempts (10/min → 60s lockout) }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out; clears the session
      responses:
        "204": { description: Logged out }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────── Files ───────────────────────────
  /api/files:
    get:
      tags: [Files]
      summary: List files
      description: |
        Returns files ordered by `modified_at DESC`. Only `system_id`, `org_id`,
        `status`, `project`, `limit`, `offset` are honoured (no `sort`/`owner`).
        Non-admins are scoped to systems they can access.
      parameters:
        - { name: system_id, in: query, schema: { type: string } }
        - { name: org_id,    in: query, schema: { type: string } }
        - { name: status,    in: query, schema: { type: string, enum: [Draft, Review, Approved, Archived] } }
        - { name: project,   in: query, schema: { type: string } }
        - { name: limit,     in: query, schema: { type: integer, default: 200, maximum: 2000 } }
        - { name: offset,    in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/File" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Files, Upload]
      summary: Upload one or more files (multipart)
      description: |
        `multipart/form-data`. **Requires `editor` or `admin`.** Body limit 64 MiB
        (use TUS for larger). `system_id` is **required** (400 otherwise). Repeat the
        `file` part to upload several at once; the text fields apply to them.
        Field order does not matter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, system_id]
              properties:
                file:      { type: string, format: binary, description: "The file bytes (repeatable)" }
                system_id: { type: string, description: "Target system, e.g. sys_hr (required)" }
                org_id:    { type: string }
                folder_id: { type: string }
                project:   { type: string }
                status:    { type: string, enum: [Draft, Review, Approved, Archived] }
                owner:     { type: string }
                tags:      { type: string, description: "JSON array string, e.g. [\"contract\",\"2026\"]" }
            encoding:
              file: { contentType: application/octet-stream }
      responses:
        "200":
          description: The created file (single object).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { description: Missing/unknown system_id, bad body, or over quota }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/files/batch:
    post:
      tags: [Files, Upload]
      summary: Upload multiple files, returns the created list
      description: Same multipart contract as `POST /api/files`; returns an array. Requires editor/admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "200":
          description: Created files
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/File" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/files/{id}:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    get:
      tags: [Files]
      summary: File detail
      responses:
        "200": { description: File, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Files]
      summary: Update metadata / status (editor+)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:    { type: string }
                status:  { type: string }
                project: { type: string }
                owner:   { type: string }
                tags:    { type: string }
                folder_id: { type: string }
      responses:
        "200": { description: Updated file, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Files, Trash]
      summary: Soft-delete (editor+) or hard-delete/purge (admin, ?hard=true)
      parameters:
        - { name: hard, in: query, schema: { type: boolean }, description: "admin-only; permanently purges" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/files/{id}/download:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    get:
      tags: [Files]
      summary: Download file bytes (decrypted); supports ETag + ?version=
      parameters:
        - { name: version, in: query, schema: { type: integer } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200": { description: File bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/files/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    get:
      tags: [Files]
      summary: List version history
      responses:
        "200": { description: Versions, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Files, Upload]
      summary: Upload a new version (multipart, editor+)
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary }, note: { type: string } } }
      responses:
        "200": { description: New version's file, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/files/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    post:
      tags: [Trash]
      summary: Restore a soft-deleted file (editor+)
      responses:
        "200": { description: Restored file, content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/trash:
    get:
      tags: [Trash]
      summary: List soft-deleted files
      responses:
        "200": { description: Trashed files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/File" } } } } }

  # ─────────────────────── Resumable upload (TUS 1.0.0) ───────────────────────
  /api/uploads:
    post:
      tags: [Upload]
      summary: TUS creation — start a resumable upload
      description: |
        TUS 1.0.0 (`creation` + `termination`). Send `Upload-Length`,
        `Tus-Resumable: 1.0.0`, and base64 `Upload-Metadata` with the same keys as
        the multipart form (`filename`, `content_type`, `system_id`, `org_id`,
        `project`, `status`, `owner`, `tags`). Returns `201` with a `Location`
        header to PATCH chunks to. The web client uses tus-js-client at ~50 MiB+.
      responses:
        "201": { description: Session created; see Location header, headers: { Location: { schema: { type: string } } } }
    options:
      tags: [Upload]
      summary: TUS capability discovery
      responses:
        "204": { description: Tus-Version / Tus-Extension headers }
  /api/uploads/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    head:
      tags: [Upload]
      summary: TUS — current Upload-Offset
      responses: { "200": { description: Returns Upload-Offset } }
    patch:
      tags: [Upload]
      summary: TUS — append a chunk
      requestBody:
        content: { application/offset+octet-stream: { schema: { type: string, format: binary } } }
      responses: { "204": { description: Chunk stored; new Upload-Offset returned. On final chunk the file is persisted. } }
    delete:
      tags: [Upload]
      summary: TUS — terminate/abort the session
      responses: { "204": { description: Aborted } }

  # ─────────────────────────── Search ───────────────────────────
  /api/search:
    get:
      tags: [Search]
      summary: Full-text search (name, tags, owner, extracted PDF/txt content)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Matching files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/File" } } } } }

  # ─────────────────────────── AI ───────────────────────────
  /api/search/semantic:
    post:
      tags: [AI, Search]
      summary: Meaning-based search over chunk embeddings (pgvector kNN)
      description: >-
        Embeds the query and returns the best-matching chunk per file, ranked by
        cosine similarity. Permission-scoped exactly like keyword search
        (`effective_system_ids`). Returns **400** when AI is disabled
        (`AI_ENABLED=false`) or `q` is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q:         { type: string, description: Natural-language query }
                limit:     { type: integer, default: 10, minimum: 1, maximum: 50 }
                system_id: { type: string, description: Optional — restrict to one system the caller can read }
      responses:
        "200":
          description: Best-matching chunk per file, closest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SemanticHit" } }
        "400": { description: AI disabled or empty query, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/ask:
    post:
      tags: [AI]
      summary: RAG — grounded, cited, permission-aware answer over accessible content
      description: >-
        Retrieves the most relevant chunks the caller is allowed to read, grounds
        the chat model on them, and returns an answer with inline `[n]` citations.
        Retrieval is filtered by the caller's current `effective_system_ids`, so an
        answer can never draw on content the caller can't read. When nothing
        relevant is found, returns a benign "no information" answer with empty
        citations (still **200**).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:  { type: string }
                system_id: { type: string, description: Optional — scope to one system }
                file_id:   { type: string, format: uuid, description: Optional — pin the answer to one document }
                limit:     { type: integer, default: 6, minimum: 1, maximum: 10, description: Max sources to ground on }
      responses:
        "200":
          description: Cited answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
        "400": { description: AI disabled or empty question, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/files/{id}/ai:
    get:
      tags: [AI, Files]
      summary: Per-file AI understanding (summary / tags / sensitivity) + enrichment status
      description: >-
        Returns the asynchronously-produced AI summary, tags, detected language and
        sensitivity for a file, plus the enrichment lifecycle `status`
        (`none | queued | running | done | failed`) for the UI. `ai` is null until
        the worker finishes. **404** (not 403) when the caller can't see the file.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: AI panel data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileAiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────── Checkout ───────────────────────────
  /api/files/{id}/lock:
    get:
      tags: [Checkout, Files]
      summary: Current check-out lock state for a file
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200": { description: Lock state, content: { application/json: { schema: { $ref: "#/components/schemas/LockInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/files/{id}/checkout:
    post:
      tags: [Checkout, Files]
      summary: Check out (lock) a file to the current user
      description: >-
        Locks the file so others may view but not edit or check it out. Idempotent
        when already held by the caller. Requires role admin or editor. Stale locks
        are auto-released by the rotation worker (`CHECKOUT_TTL_HOURS`, default 8h).
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200": { description: Locked (or already held by caller), content: { application/json: { schema: { $ref: "#/components/schemas/LockInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already checked out by another user, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/files/{id}/checkin:
    post:
      tags: [Checkout, Files]
      summary: Check in (release) a file's lock
      description: Only the lock holder or an admin may check in. No-op when already free.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200": { description: Released, content: { application/json: { schema: { $ref: "#/components/schemas/LockInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Caller is neither the holder nor an admin, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ─────────────────────────── E-signatures ───────────────────────────
  /api/signatures:
    get:  { tags: [Signatures], summary: My signature library, responses: { "200": { description: Signatures } } }
    post: { tags: [Signatures], summary: Save a signature mark (label/kind/image data-URL), responses: { "200": { description: Created }, "400": { description: image required } } }
  /api/signatures/{id}:
    delete: { tags: [Signatures], summary: Delete a signature, responses: { "204": { description: Deleted } } }
  /api/files/{id}/sign-requests:
    get:
      tags: [Signatures]
      summary: Sign requests on a file
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses: { "200": { description: Requests + signers }, "404": { $ref: "#/components/responses/NotFound" } }
    post:
      tags: [Signatures]
      summary: Start a signing request (editor+); ordered or parallel multi-signer
      description: "Body: { order_mode: sequential|parallel, message, expires_at, signers: [{ user_id, seq, page, pos_x, pos_y, width, height }] }. Captures a SHA-256 of the document at creation and notifies the first signer(s)."
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses:
        "200": { description: Created request + signers }
        "400": { description: no signers }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/sign-requests/mine:
    get: { tags: [Signatures], summary: Documents awaiting my signature (with my_turn), responses: { "200": { description: Queue } } }
  /api/sign-requests/{id}/sign:
    post:
      tags: [Signatures]
      summary: Sign (assigned signer; your turn if sequential)
      description: "Body: { signature_id? }. Records a SHA-256 of the document at signing + signer IP; completes the request when all have signed."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Updated request + signers }
        "404": { description: not an assigned signer / unknown request }
        "409": { description: not your turn / already resolved / expired }
  /api/sign-requests/{id}/decline:
    post: { tags: [Signatures], summary: Decline to sign, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Declined }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sign-requests/{id}/verify:
    get:
      tags: [Signatures]
      summary: Integrity + signer audit (intact = document unchanged since signing)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Verify result }, "404": { $ref: "#/components/responses/NotFound" } }

  # ─────────────────────────── Starred ───────────────────────────
  /api/starred:
    get:
      tags: [Files]
      summary: The caller's starred files (permission-scoped)
      responses:
        "200": { description: Starred files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/File" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/files/{id}/star:
    get:
      tags: [Files]
      summary: Whether the caller has starred this file
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses:
        "200": { description: Star state, content: { application/json: { schema: { $ref: "#/components/schemas/StarState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Files]
      summary: Star a file (idempotent)
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses:
        "200": { description: Starred, content: { application/json: { schema: { $ref: "#/components/schemas/StarState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Files]
      summary: Unstar a file
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses:
        "200": { description: Unstarred, content: { application/json: { schema: { $ref: "#/components/schemas/StarState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────── Folders ───────────────────────────
  /api/folders:
    get:
      tags: [Folders]
      summary: List folders (filter by ?system_id=)
      parameters: [{ name: system_id, in: query, schema: { type: string } }]
      responses: { "200": { description: Folders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Folder" } } } } } }
    post:
      tags: [Folders]
      summary: Create a folder (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, system_id]
              properties:
                name:      { type: string }
                system_id: { type: string }
                org_id:    { type: string }
                color:     { type: string }
                encrypted: { type: boolean }
      responses:
        "200": { description: Created folder, content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/folders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [Folders]
      summary: Delete a folder (editor+)
      responses: { "204": { description: Deleted }, "403": { $ref: "#/components/responses/Forbidden" } }

  # ─────────────────────────── Sharing ───────────────────────────
  /api/files/{id}/share:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    post:
      tags: [Sharing]
      summary: Create a tokenized share link (editor+)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days: { type: integer }
                note:            { type: string }
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:      { type: string }
                  url:        { type: string }
                  expires_at: { type: string, format: date-time, nullable: true }
                  file:       { $ref: "#/components/schemas/File" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/files/{id}/share-links:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    get:
      tags: [Sharing]
      summary: List a file's share links (editor+, access-gated) so they can be reviewed/revoked
      responses:
        "200":
          description: Share links on the file
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:         { type: string, format: uuid }
                    token:      { type: string }
                    created_by: { type: string }
                    note:       { type: string, nullable: true }
                    created_at: { type: string, format: date-time }
                    expires_at: { type: string, format: date-time, nullable: true }
                    expired:    { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/share-links/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [Sharing]
      summary: Revoke a share link immediately (its creator or an admin)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/share/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Sharing]
      summary: Public — minimal share metadata (no auth; the token IS the credential)
      description: >
        Returns only display-safe fields (name, file_type, size_bytes, created_at).
        Storage layout, org/system ids, owner and other internals are deliberately withheld.
      security: []
      responses:
        "200":
          description: Minimal share metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:       { type: string }
                  file_type:  { type: string }
                  size_bytes: { type: integer, format: int64 }
                  created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/share/{token}/download:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Sharing]
      summary: Public — download a shared file (no auth)
      security: []
      responses:
        "200": { description: File bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/permissions/{file_id}:
    parameters: [{ name: file_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Sharing]
      summary: List explicit permissions on a file
      responses: { "200": { description: Permissions, content: { application/json: { schema: { type: array, items: { type: object } } } } } }

  # ─────────────────────────── Comments / Workflow ───────────────────────────
  /api/files/{id}/comments:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    get:
      tags: [Comments]
      summary: List comments
      responses: { "200": { description: Comments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Comment" } } } } } }
    post:
      tags: [Comments]
      summary: Add a comment (any signed-in role, incl. viewer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string }, parent_id: { type: string, nullable: true } }
      responses: { "200": { description: Created comment, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } } }
  /api/files/{id}/comments/{comment_id}:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
      - { name: comment_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Comments]
      summary: Delete a comment
      responses: { "204": { description: Deleted } }
  /api/files/{id}/workflow:
    parameters: [{ $ref: "#/components/parameters/FileId" }]
    get: { tags: [Workflow], summary: List review workflows + steps, responses: { "200": { description: Workflows } } }
    post:
      tags: [Workflow]
      summary: Start a review workflow (editor+) — sequential or parallel, or from a template
      description: "Body: { reviewer_ids?: [uid], order_mode?: sequential|parallel, template_id?, note? }. With template_id the steps come from the template; sequential notifies one reviewer at a time (with a turn-guard), parallel notifies all."
      responses: { "200": { description: Started }, "400": { description: no reviewers/unknown template }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/workflow-templates:
    get:  { tags: [Workflow], summary: Reusable no-code flow templates, responses: { "200": { description: Templates } } }
    post: { tags: [Workflow], summary: "Create a template (editor+): { name, order_mode, steps:[{name?,reviewer_id}] }", responses: { "200": { description: Created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/workflow-templates/{id}:
    delete: { tags: [Workflow], summary: Delete a template (editor+), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Deleted } } }
  /api/workflow-steps/{id}/send-back:
    post:
      tags: [Workflow]
      summary: Send the workflow back to this step for rework (editor+)
      description: Reopens this step and every step after it (→ pending), returns the workflow + file to Review, and re-notifies the step's reviewer.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Reopened }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/workflow-steps/{id}/decision:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Workflow]
      summary: Approve/reject a workflow step (editor+)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { decision: { type: string, enum: [approved, rejected] }, note: { type: string } } } } }
      responses: { "200": { description: Recorded }, "403": { $ref: "#/components/responses/Forbidden" } }

  # ─────────────────────────── Requests ───────────────────────────
  # Form/document submissions routed through the workflow engine. A request
  # anchors to a document and reuses file_workflows for approvals; decisions go
  # through /api/workflow-steps/{id}/decision above.
  /api/request-forms:
    get: { tags: [Requests], summary: "Active request forms + each form's resolved approval route (Everyday + intake)", responses: { "200": { description: Forms } } }
  # Form Designer — admin-authored request types (fields + linked workflow template).
  /api/forms:
    get: { tags: [Requests], summary: "List all request forms incl. inactive (Form Designer, editor+)", responses: { "200": { description: Forms }, "403": { $ref: "#/components/responses/Forbidden" } } }
    post:
      tags: [Requests]
      summary: "Create a request form (editor+)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name_en]
              properties:
                id:          { type: string, description: "Omit to generate form_<id>" }
                name_en:     { type: string }
                name_th:     { type: string }
                description: { type: string, nullable: true }
                icon:        { type: string, enum: [expense, it, document, leave, generic] }
                color:       { type: string, description: "design-token color name" }
                fields:      { type: array, items: { type: object, properties: { key: { type: string }, label_en: { type: string }, label_th: { type: string }, kind: { type: string, enum: [text, textarea, number, money, date] }, required: { type: boolean } } } }
                template_id: { type: string, nullable: true, description: "linked workflow_templates.id (the route)" }
                active:      { type: boolean }
                sort_order:  { type: integer }
      responses: { "200": { description: Created }, "400": { description: Bad request }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/forms/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Requests]
      summary: "Update a request form (editor+)"
      responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      tags: [Requests]
      summary: "Delete a request form (editor+)"
      responses: { "204": { description: Deleted }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/requests/intake:
    post:
      tags: [Requests]
      summary: "AI: turn a plain-language message into a structured draft (kind + fields + title + summary + suggested route)"
      description: No persistence — the client reviews before submitting. 400 when AI is disabled (client falls back to the manual form).
      requestBody:
        content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string } } } } }
      responses: { "200": { description: Draft }, "400": { description: Bad request } }
  /api/requests:
    get:
      tags: [Requests]
      summary: List requests — box=mine (my submissions) | inbox (awaiting my decision) | all
      parameters: [{ name: box, in: query, schema: { type: string, enum: [mine, inbox, all] } }]
      responses: { "200": { description: Requests } }
    post:
      tags: [Requests]
      summary: "Submit a request (any signed-in user). Generates or accepts an anchor document, then starts a workflow"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, title]
              properties:
                kind:       { type: string, enum: [expense, it, document, leave] }
                title:      { type: string }
                form_data:  { type: object }
                amount:     { type: number, nullable: true }
                file_id:    { type: string, format: uuid, nullable: true, description: "Anchor already uploaded to sys_requests; omit to auto-generate" }
                reviewers:  { type: array, items: { type: object, properties: { reviewer_id: { type: string }, step_name: { type: string } } }, description: "Caller-edited route; omit for the policy route" }
                order_mode: { type: string, enum: [sequential, parallel] }
                ai_summary: { type: string, nullable: true }
      responses: { "200": { description: Created request (detail) }, "400": { description: Bad request } }
  /api/requests/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Requests]
      summary: Request detail (requester, an assigned reviewer, or admin) — form + anchor + workflow steps
      responses: { "200": { description: Detail }, "404": { $ref: "#/components/responses/NotFound" } }

  # ─────────────────────────── Notifications ───────────────────────────
  /api/notifications:
    get: { tags: [Notifications], summary: List notifications, responses: { "200": { description: Notifications } } }
  /api/notifications/unread-count:
    get: { tags: [Notifications], summary: Unread count, responses: { "200": { description: "{ count }" } } }
  /api/notifications/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [Notifications], summary: Mark a notification read, responses: { "200": { description: OK } } }

  # ─────────────────────────── Views / Activity / Reports ───────────────────────────
  /api/views:
    get: { tags: [Views], summary: List saved views, responses: { "200": { description: Views, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/View" } } } } } } }
    post:
      tags: [Views]
      summary: Create a saved view (any signed-in role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:    { type: string }
                layout:  { type: string, enum: [table, board, gallery, calendar, timeline] }
                color:   { type: string }
                pinned:  { type: boolean }
                filters: { type: array, items: { type: object, properties: { field: { type: string }, op: { type: string }, value: {} } } }
      responses: { "200": { description: Created view, content: { application/json: { schema: { $ref: "#/components/schemas/View" } } } } }
  /api/activity:
    get:
      tags: [Reports]
      summary: Recent activity feed
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 20 } }]
      responses: { "200": { description: Activity, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Activity" } } } } } }
  /api/stats:
    get:
      tags: [Reports]
      summary: Dashboard stats (totals, quota, storage-by-system, connected systems)
      responses: { "200": { description: Stats, content: { application/json: { schema: { $ref: "#/components/schemas/Stats" } } } } }
  /api/reports/by-category:
    get: { tags: [Reports], summary: Report — counts/size by category, responses: { "200": { description: Report } } }
  /api/reports/by-time:
    get: { tags: [Reports], summary: Report — activity over time, responses: { "200": { description: Report } } }
  /api/reports/status:
    get:
      tags: [Reports]
      summary: Document status report (active / inactive / retention / deleted)
      description: >-
        Lifecycle counts plus the 200 most recently modified items, mapping
        FileHub's soft-delete + rotation lifecycle onto the four TOR states.
        Permission-scoped via `effective_system_ids`.
      responses:
        "200": { description: Status report, content: { application/json: { schema: { $ref: "#/components/schemas/StatusReport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/reports/status.csv:
    get:
      tags: [Reports]
      summary: Document status report as Excel-readable CSV (UTF-8 BOM)
      responses:
        "200": { description: CSV download, content: { "text/csv": { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/reports/ai-usage:
    get:
      tags: [Reports, AI]
      summary: AI token/op usage metering for billing (admin-only)
      description: >-
        Totals plus per-op and per-model breakdowns of AI usage recorded by the
        backend on every billable op (embed / ask / summarize). Workspace-wide
        billing concern — **admin only** (editors/viewers get 403).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: ISO timestamp lower bound (inclusive) }
        - { name: to,   in: query, schema: { type: string, format: date-time }, description: ISO timestamp upper bound (inclusive) }
      responses:
        "200": { description: Usage report, content: { application/json: { schema: { $ref: "#/components/schemas/AiUsageReport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/activity/export.csv:
    get:
      tags: [Reports]
      summary: User audit-log export as CSV (date range + user filter)
      description: Searchable by date range and user; exported as Excel-readable CSV (UTF-8 BOM). Permission-scoped. Capped at 5000 rows.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: ISO timestamp lower bound (inclusive) }
        - { name: to,   in: query, schema: { type: string, format: date-time }, description: ISO timestamp upper bound (inclusive) }
        - { name: user, in: query, schema: { type: string }, description: Substring match on actor name (ILIKE) }
      responses:
        "200": { description: CSV download, content: { "text/csv": { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────── Systems & Orgs ───────────────────────────
  /api/systems:
    get: { tags: [Systems & Orgs], summary: List systems (buckets), responses: { "200": { description: Systems, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/System" } } } } } } }
    post: { tags: [Systems & Orgs], summary: Create a system/bucket (admin), responses: { "200": { description: Created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/systems/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Systems & Orgs], summary: Rename/update a system (admin), responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
    delete: { tags: [Systems & Orgs], summary: Delete a system (admin), responses: { "204": { description: Deleted }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/orgs:
    get:
      tags: [Systems & Orgs]
      summary: List orgs (filter by ?system_id=)
      parameters: [{ name: system_id, in: query, schema: { type: string } }]
      responses: { "200": { description: Orgs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } } }
  /api/orgs/{id}/quota:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Admin], summary: Set per-org quota (admin), responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/personal-drive:
    get: { tags: [Systems & Orgs], summary: The caller's personal "My Drive" system, responses: { "200": { description: System } } }

  # ─────────────────────────── Admin ───────────────────────────
  /api/workspace:
    get: { tags: [Admin], summary: Workspace config (name, quota, access flags), responses: { "200": { description: k/v map } } }
    patch: { tags: [Admin], summary: Update workspace config (admin), responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/users:
    get: { tags: [Admin], summary: List members (editor+), responses: { "200": { description: Members } } }
    post: { tags: [Admin], summary: Invite a member (admin), responses: { "200": { description: Created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Admin], summary: Update a member's role/status (admin), responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/users/{id}/quota:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Admin], summary: Set per-user quota (admin), responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/quota:
    get: { tags: [Admin], summary: Quota usage report, responses: { "200": { description: Report } } }
  /api/rotation/policies:
    get: { tags: [Admin], summary: List rotation policies, responses: { "200": { description: Policies } } }
    post: { tags: [Admin], summary: Upsert a rotation policy (admin), responses: { "200": { description: Saved }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/rotation/policies/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete: { tags: [Admin], summary: Delete a rotation policy (admin), responses: { "204": { description: Deleted }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/rotation/run:
    post: { tags: [Admin], summary: Run the rotation engine now (admin), responses: { "200": { description: Ran }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /api/rotation/runs:
    get: { tags: [Admin], summary: List rotation runs, responses: { "200": { description: Runs } } }

  # ─────────────────────────── API keys (machine-to-machine) ───────────────────────────
  /api/api-keys:
    get:
      tags: [Admin]
      summary: List API keys (admin) — never returns the secret
      responses: { "200": { description: Keys }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      tags: [Admin]
      summary: Create an API key (admin). Returns the plaintext key ONCE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, user_id]
              properties:
                name: { type: string, example: "CI uploader" }
                user_id: { type: string, description: "Service-account user the key authenticates as", example: "usr_anong" }
                expires_in_days: { type: integer, nullable: true, example: 90 }
      responses:
        "200":
          description: Created — `key` is shown once; store it now (only its hash is kept).
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string, example: "fhk_83jVunWus0I0..." }
                  id: { type: string, format: uuid }
                  name: { type: string }
                  key_prefix: { type: string, example: "fhk_83jVunWu" }
                  user_id: { type: string }
                  expires_at: { type: string, format: date-time, nullable: true }
        "400": { description: Invalid name or user_id }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/api-keys/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [Admin]
      summary: Revoke an API key (admin). Immediate; the key stops working.
      responses: { "204": { description: Revoked }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }

  # ─────────────────────────── Health ───────────────────────────
  /api/health:
    get: { tags: [Health], summary: Liveness (cheap static "ok"), security: [], responses: { "200": { description: ok } } }
  /api/ready:
    get: { tags: [Health], summary: Readiness (real DB + storage round-trip), security: [], responses: { "200": { description: ready }, "503": { description: not ready } } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: filehub_session
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Machine-to-machine API key (fhk_…) sent as `Authorization: Bearer <key>`.
        Created by an admin via POST /api/api-keys; authenticates as the linked
        service-account user, inheriting its role + system access.

  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: No / invalid session
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated but role not permitted
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found (or not visible to the caller)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, example: anong@acme.go.th }
        password: { type: string, example: anong123 }
    User:
      type: object
      properties:
        id:           { type: string, example: usr_anong }
        email:        { type: string, format: email }
        display_name: { type: string }
        avatar_tone:  { type: string }
        role:         { type: string, enum: [admin, editor, viewer] }
        status:       { type: string, example: active }
        created_at:   { type: string, format: date-time }
    File:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        file_type:   { type: string, example: pdf }
        size_bytes:  { type: integer }
        system_id:   { type: string, example: sys_hr }
        org_id:      { type: string, nullable: true }
        folder_id:   { type: string, nullable: true }
        bucket:      { type: string, example: hr-emp-files }
        object_key:  { type: string }
        project:     { type: string, nullable: true }
        status:      { type: string, enum: [Draft, Review, Approved, Archived] }
        owner:       { type: string }
        tags:        { type: string, description: "JSON array string", example: "[\"contract\",\"2026\"]" }
        version:     { type: integer }
        metadata:    { type: string, description: "JSON object string" }
        etag:        { type: string, nullable: true }
        encrypted:   { type: boolean }
        created_by:  { type: string, nullable: true }
        created_at:  { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        deleted_at:  { type: string, format: date-time, nullable: true }
    Folder:
      type: object
      properties:
        id:        { type: string }
        name:      { type: string }
        system_id: { type: string }
        org_id:    { type: string, nullable: true }
        color:     { type: string, nullable: true }
        encrypted: { type: boolean }
    System:
      type: object
      properties:
        id:          { type: string, example: sys_hr }
        name:        { type: string }
        bucket:      { type: string }
        tone:        { type: string }
        system_type: { type: string, enum: [shared, personal] }
    Org:
      type: object
      properties:
        id:        { type: string }
        name:      { type: string }
        code:      { type: string }
        system_id: { type: string }
    View:
      type: object
      properties:
        id:      { type: string, example: vw_abc123 }
        name:    { type: string }
        layout:  { type: string }
        filters: { type: string, description: "JSON array string of {field,op,value}" }
        pinned:  { type: boolean }
        color:   { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id:           { type: string, format: uuid }
        file_id:      { type: string, format: uuid }
        user_id:      { type: string, nullable: true }
        parent_id:    { type: string, nullable: true }
        body:         { type: string }
        display_name: { type: string }
        avatar_tone:  { type: string }
        created_at:   { type: string, format: date-time }
    Activity:
      type: object
      properties:
        id:          { type: string, format: uuid }
        actor:       { type: string }
        actor_tone:  { type: string }
        action:      { type: string }
        target:      { type: string, nullable: true }
        target_type: { type: string, nullable: true }
        file_id:     { type: string, nullable: true }
        system_id:   { type: string, nullable: true }
        org_id:      { type: string, nullable: true }
        created_at:  { type: string, format: date-time }
    Stats:
      type: object
      properties:
        total_files:       { type: integer }
        total_size_bytes:  { type: integer }
        total_quota_bytes: { type: integer }
        active_orgs:       { type: integer }
        awaiting_review:   { type: integer }
        connected_systems: { type: array, items: { type: object } }
        storage_by_system: { type: array, items: { type: object } }
    SemanticHit:
      type: object
      description: One file's best-matching chunk for a semantic query.
      properties:
        file_id:   { type: string, format: uuid }
        name:      { type: string }
        file_type: { type: string, example: pdf }
        system_id: { type: string, example: sys_hr }
        snippet:   { type: string, description: First ~280 chars of the matching chunk }
        seq:       { type: integer, description: Chunk sequence within the file }
        score:     { type: number, format: double, description: "Cosine similarity in [-1,1] (1 = closest)" }
    Citation:
      type: object
      properties:
        n:         { type: integer, description: Inline bracket number used in the answer }
        file_id:   { type: string, format: uuid }
        name:      { type: string }
        system_id: { type: string }
        snippet:   { type: string }
        score:     { type: number, format: double }
    AskResponse:
      type: object
      properties:
        answer:    { type: string, description: "Grounded answer with inline [n] citations" }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
    FileAi:
      type: object
      properties:
        summary:     { type: string, nullable: true }
        tags:        { type: array, items: { type: string } }
        language:    { type: string, nullable: true }
        sensitivity: { type: string, enum: [none, pii, confidential] }
        model:       { type: string, nullable: true }
        updated_at:  { type: string, format: date-time }
    FileAiResponse:
      type: object
      properties:
        status: { type: string, enum: [none, queued, running, done, failed], description: Enrichment lifecycle for the UI }
        ai:     { allOf: [{ $ref: "#/components/schemas/FileAi" }], nullable: true }
    StarState:
      type: object
      properties:
        starred: { type: boolean }
    LockInfo:
      type: object
      properties:
        locked:  { type: boolean }
        by_id:   { type: string, nullable: true }
        by_name: { type: string, nullable: true }
        at:      { type: string, format: date-time, nullable: true }
        by_me:   { type: boolean, description: True when the current caller is the holder }
    StatusItem:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        system_id:   { type: string }
        status:      { type: string, description: FileHub's own status field }
        state:       { type: string, enum: [active, inactive, retention], description: TOR lifecycle state }
        modified_at: { type: string, format: date-time }
        deleted_at:  { type: string, format: date-time, nullable: true }
    StatusReport:
      type: object
      properties:
        active:    { type: integer }
        inactive:  { type: integer }
        retention: { type: integer }
        deleted:   { type: integer, description: Cumulative hard-deleted count from rotation history }
        items:     { type: array, items: { $ref: "#/components/schemas/StatusItem" } }
    AiUsageBucket:
      type: object
      properties:
        key:           { type: string, description: The op or model name this bucket aggregates }
        ops:           { type: integer }
        input_tokens:  { type: integer }
        output_tokens: { type: integer }
    AiUsageReport:
      type: object
      properties:
        total_ops:           { type: integer }
        total_input_tokens:  { type: integer }
        total_output_tokens: { type: integer }
        by_op:    { type: array, items: { $ref: "#/components/schemas/AiUsageBucket" } }
        by_model: { type: array, items: { $ref: "#/components/schemas/AiUsageBucket" } }
